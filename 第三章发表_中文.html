rder:1px solid var(--line);background:#f5f9f2;padding:10px 12px;border-radius:8px;color:var(--ink);text-align:left;font-size:15px}.cover{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;height:100%}.cover h1{font-size:65px;line-height:1.18;margin:0 0 22px;letter-spacing:-.04em}.cover p{font-size:25px;line-height:1.5;color:var(--muted)}.cover-graphic{background:#e4f0dc;padding:40px;border-radius:28px}.cover-graphic .block{background:#fff}.cover-graphic .diagram-label{font-weight:800;color:var(--green);font-size:16px;margin:12px 0}.highlight{color:var(--green);font-weight:800}.warning{color:#9b5536}.note-inline{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.4}

<script>
const JA='zh'==='ja', L=(ja,zh)=>JA?ja:zh;
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D=(name,sub='')=>`<div class="block">${E(name)}${sub?`<small>${E(sub)}</small>`:''}</div>`, A='<span class="arr">→</span>';
const side=(title,body,take)=>`<aside class="explain"><h2>${title}</h2>${body}<div class="take">${take}</div></aside>`;
const screen=(label,title,subtitle,visual,explanation)=>({label,title,subtitle,visual,explanation});
const S=[];
S.push(screen('CHAPTER 03',L('GPTモデルの作成','构建 GPT 模型'),L('GPTの概要と、文章がモデルに届くまで','认识 GPT，以及文字进入模型的过程'),'', ''));
S.push(screen(L('発表の流れ','发表内容'),L('今回の内容','本次发表的内容'),L('3.1と3.2の２つの内容を順番に見ていきます。','依次介绍 3.1 和 3.2 两部分。'),`<div class="vgrid two"><div class="chapter now" style="min-height:210px"><b>3.1</b><h3>${L('GPTモデルの概要','GPT 模型概述')}</h3><p>${L('GPTの基本的な仕組み','GPT 的基本工作方式')}</p></div><div class="chapter now" style="min-height:210px"><b>3.2</b><h3>${L('トークナイザと入力処理','分词器与输入处理')}</h3><p>${L('文章をモデルの入力に変える','将文字转换成模型输入')}</p></div></div><div class="flow" style="margin-top:35px">${D(L('GPTを知る','认识 GPT'))}${A}${D(L('入力を準備する','准备输入'))}</div>`,side(L('今回の到達点','本次目标'),`<p>${L('GPTの基本を理解し、文章がどのように数値へ変わるかを説明できる。','理解 GPT 的基本概念，并说明文字如何变成模型输入。')}</p>`,L('3.1と3.2を中心に扱う。','本次重点是 3.1 和 3.2。'))));
S.push(screen('02 → 03',L('Transformer の部品から GPT へ','从 Transformer 的部件走向 GPT'),L('第二章の知識が、第三章のモデル作成につながる。','第二章的知识，为第三章构建模型打基础。'),`<div class="vgrid two"><div class="box"><span class="tag">CHAPTER 02</span><h2 style="margin:16px 0">Transformer</h2><div class="flow">${D(L('エンコーダ','编码器'))}${A}${D(L('デコーダ','解码器'))}</div><p>${L('翻訳などに使う構成を学んだ。','学习了可用于翻译等任务的结构。')}</p></div><div class="box"><span class="tag">CHAPTER 03</span><h2 style="margin:16px 0">GPT</h2><div class="flow"><div class="block dark">${L('デコーダ系','解码器式')}<small>${L('自己注意を使う','使用自注意力')}</small></div>${A}${D(L('次のtoken','下一个 token'))}</div><p>${L('文脈を使って次の token を予測する。','根据上下文预测下一个 token。')}</p></div></div><div class="flow" style="margin-top:35px">${D(L('第二章の部品','第二章的部件'),L('注意・埋め込み等','注意力、嵌入等'))}${A}${D(L('GPTの入力','GPT 的输入'))}${A}${D(L('予測','预测'))}</div>`,side(L('ここがつながる','两章的连接'),`<p>${L('GPTは Transformer のデコーダ側を基礎にした言語モデル。入力処理を理解すると、その先の学習も追いやすい。','GPT 是以 Transformer 解码器部分为基础的语言模型。先理解输入处理，后续训练更容易跟上。')}</p>`,L('今回はGPTの基本と入力の準備を見ていく。','本次介绍 GPT 的基本概念和输入准备。'))));
S.push(screen('3.1 / GPT',L('GPTの３文字が示すもの','GPT 的三个字母代表什么'),L('名前から、モデルの役割と作られ方を整理する。','通过名称，理解模型的作用和构成。'),`<div class="vgrid three">${[['G','Generative',L('文章を生成','生成文本'),L('次の token をつなげる','逐步连接下一个 token')],['P','Pre-trained',L('事前に学習','预先学习'),L('大量のテキストから学ぶ','从大量文本中学习')],['T','Transformer',L('基本構造','基础结构'),L('デコーダ側を基礎にする','以解码器部分为基础')]].map(x=>`<div class="chapter now" style="min-height:240px"><div style="font-size:55px;color:var(--green);font-weight:900">${x[0]}</div><h3>${x[1]}</h3><p style="font-size:18px;color:var(--ink)">${x[2]}</p><p>${x[3]}</p></div>`).join('')}</div><div class="flow">${D(L('大量の文章','大量文本'))}${A}${D(L('事前学習','预训练'))}${A}${D(L('生成するモデル','生成式模型'))}</div>`,side(L('ひとことで','一句话理解'),`<p>${L('大量のテキストから言語のパターンを学び、文脈に続くテキストを生成するモデル。','从大量文本学习语言规律，并根据上下文生成后续文本的模型。')}</p>`,L('対話向けの追加学習は、事前学習とは別の段階。','面向对话的后续训练与预训练是不同阶段。'))));
S.push(screen('3.1 / NEXT TOKEN',L('生成は「次」を繰り返す','生成：反复预测“下一个”'),L('一度に文章全体を出すのではなく、文脈を更新しながら進む。','不是一次产生整句话，而是逐步更新上下文。'),`<div class="visual-label">${L('文脈が伸びるようす','上下文逐步增长')}</div><div id="gen-lanes" class="col"></div><div class="controls"><button class="button" id="gen-step">${L('次の予測を表示','显示下一步预测')}</button><button class="button secondary" id="gen-reset">${L('最初から','从头开始')}</button></div><div class="note-inline">${L('説明用の例。候補は固定で、実モデルの確率ではありません。','说明用的固定示例，并非真实模型的概率。')}</div>`,side(L('なぜ繰り返す？','为什么要反复预测？'),`<p>${L('選ばれた token を元の文に追加し、更新された文脈から次を予測する。','将选中的 token 加入原有内容，再从更新后的上下文预测下一个。')}</p><p>${L('後半では小さな数値モデルで、予測に至る計算を実際に追う。','后面会用一个小型数值模型，真正计算预测过程。')}</p>`,L('選択 → 追加 → 再予測','选择 → 添加 → 再预测'))));
S.push(screen('3.1 / CAUSAL',L('未来を見ない：因果マスク','不能提前看答案：因果遮罩'),L('各位置が参照できる範囲を、表で確認する。','用表格确认每个位置能够查看的范围。'),`<div class="row"><div><div class="visual-label">${L('行＝予測側　列＝参照先','行＝当前位置　列＝可查看的位置')}</div><table class="matrix" id="mask-table"></table></div><div style="flex:1;padding:15px"><span class="tag">${L('位置を選択','选择位置')}</span><div class="controls" id="mask-buttons"></div><div class="box" id="mask-explain"></div></div></div><div class="row"><span class="chip">${L('参照できる','可查看')}</span><span class="chip unknown">${L('未来：参照不可','未来：不可查看')}</span><span class="small">${L('緑の行は選択中の位置','绿色行是当前选中的位置')}</span></div>`,side(L('情報漏れを防ぐ','防止提前看到答案'),`<p>${L('左から順に予測するため、各位置から右側の未来 token は見えないようにする。','按顺序预测时，每个位置不能查看后面的 token。')}</p><p>${L('この制約が、学習時と生成時の条件をそろえる。','这一限制让训练时与生成时的可用信息保持一致。')}</p>`,L('後ろを隠し、前までを見る。','遮住后面，只看之前。'))));

function modelControls(container){document.getElementById(container).innerHTML=[1,2].map(i=>`<button class="button ${i===modelLast?'on':'secondary'}" data-model="${i}">I + ${vocab[i]}</button>`).join('')}
function barHTML(name,value,best,extra=''){return `<div class="barrow"><b class="mono">${name}</b><div class="bartrack"><div class="barfill ${best?'best':''}" style="width:${value*100}%"></div></div><span class="mono">${(value*100).toFixed(1)}%</span></div>${extra}`}
function drawModel(){let m=calculate();modelControls('model-buttons');modelControls('model2-buttons');document.getElementById('attention-input').textContent=`x₀ = ${vec(m.xs[0])}     x₁ = ${vec(m.xs[1])}     score = Q·K / √2`;document.getElementById('attention-matrix').innerHTML=`<tr><th>score</th><th>I</th><th>${vocab[modelLast]}</th></tr>`+m.scores.map((r,i)=>`<tr><th>${i===0?'I':vocab[modelLast]}</th>${r.map((x,j)=>`<td class="${x===null?'mask':i===1?'sel':''}">${x===null?'×':fmt(x)}</td>`).join('')}</tr>`).join('');document.getElementById('attention-bars').innerHTML=m.weights[1].map((x,i)=>barHTML(i===0?'I':vocab[modelLast],x,i===m.weights[1].indexOf(Math.max(...m.weights[1])))).join('');document.getElementById('attention-context').innerHTML=`${L('加重和','加权和')}<br>${fmt(m.weights[1][0])} × x₀ + ${fmt(m.weights[1][1])} × x₁<br>= ${vec(m.ctx)}`;document.getElementById('prediction-vector').textContent=`${L('注意の加重和','注意力加权和')} = ${vec(m.ctx)}`;let best=m.probs.indexOf(Math.max(...m.probs));document.getElementById('prediction-bars').innerHTML=m.probs.map((x,i)=>barHTML(vocab[i],x,i===best,`<div class="tiny" style="margin-top:-8px;margin-left:95px">logit = ${fmt(m.logits[i])}</div>`)).join('');document.getElementById('prediction-result').innerHTML=`<b>${L('最大確率の候補','最大概率候选')}: <span class="highlight">${vocab[best]}</span></b><p>${vocab[best]}: ${vec(m.ctx)} · ${vec(emb[best])} = ${fmt(m.logits[best])}</p>`}
['model-buttons','model2-buttons'].forEach(id=>document.getElementById(id).onclick=e=>{let b=e.target.closest('[data-model]');if(b){modelLast=+b.dataset.model;drawModel()}});drawModel();show(0);
</script></body></html>
