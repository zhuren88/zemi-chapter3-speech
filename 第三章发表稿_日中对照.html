</style></head><body><header class="top"><div class="top-inner"><div><h1 class="title">第三章发表稿 · 日中对照</h1><div class="subtitle">日语发表 · 中文理解</div></div><div class="actions"><select id="jump" class="jump" aria-label="跳转到页面"></select><button id="edit" class="button">编辑内容</button><button id="download" class="button primary">下载保存副本</button><span class="status" id="status" aria-live="polite"></span></div></div></header><div class="columns"><span>日文演讲稿</span><span>中文演讲稿</span></div><main class="container"><div class="hint">左右为对应段落 · 点击“编辑内容”修改文字</div><div id="pages"></div><div class="end">END</div></main><script id="initial-data" type="application/json">{"pages":[{"number":1,"title":"开场与发表范围","action":"打开首页，进入下一页。","pairs":[{"ja":"今日は、教科書の第３章「GPTモデルの作成」について発表します。","zh":"今天我将发表教材第三章的内容。"},{"zh":"本次发表介绍第三章的前两节：3.1 GPT 模型概述，以及 3.2 分词器与输入处理。","ja":"今回は、第３章の前半にあたる3.1節のGPTの概要と、3.2節のトークナイザと入力処理について発表します。"},{"ja":"特に、GPTがどのように文章を生成するのか、そして、私たちが入力した文章がどのような形になってモデルに渡されるのかを、図と実演を使いながら見ていきます。","zh":"我会重点结合图示和演示，说明 GPT 如何生成文本，以及我们输入的文字经过怎样的处理后被送入模型。"}]},{"number":2,"title":"本次发表的内容","action":"依次介绍 3.1 和 3.2 的内容。","pairs":[{"zh":"首先介绍本次发表的两个部分。","ja":"まず、今回発表する２つの内容を紹介します。"},{"zh":"3.1 节介绍 GPT 是什么，以及它的基本工作方式。","ja":"3.1節では、GPTとは何か、そしてその基本的な仕組みについて説明します。"},{"zh":"3.2 节介绍分词器和输入处理，看看文字怎样变成模型能够处理的数据。","ja":"3.2節では、トークナイザと入力処理を取り上げ、文章がどのようにモデルで扱えるデータになるのかを見ていきます。"},{"zh":"我们会先认识 GPT，再一步步了解文字如何进入模型。","ja":"まずGPTの基本を確認してから、文章がモデルに入力されるまでの流れを、一つずつ見ていきます。"}]},{"number":3,"title":"从 Transformer 到 GPT","action":"先指左侧 Transformer 图，再指右侧 GPT 图。","pairs":[{"ja":"ここで、前の章とのつながりを確認します。第２章では、Transformerの基本的な構造を学びました。","zh":"这里先确认与上一章的联系。第二章学习了 Transformer 的基本结构。"},{"ja":"今回学ぶGPTは、Transformerのデコーダ側を基礎にした言語モデルです。GPTは、それまでに与えられた文章を文脈として使い、次に続くトークンを予測します。","zh":"而本次学习的 GPT，是以 Transformer 解码器部分为基础的语言模型。GPT 使用此前给出的文本作为上下文，预测接下来会出现的 token。"}]},{"number":4,"title":"GPT 的名称","action":"依次指向 G、P、T 三个部分。","pairs":[{"ja":"それでは、GPTという名前から見ていきます。GPTは、Generative Pre-trained Transformerの略です。","zh":"接下来先看 GPT 这个名称。GPT 是 Generative Pre-trained Transformer 的缩写。"},{"ja":"最初のG、Generativeは「生成する」という意味です。GPTは、入力された文章の続きを予測し、新しい文章を生成できます。","zh":"第一个字母 G，Generative，意思是“生成式”。GPT 可以预测输入文本后面的内容，进而生成新的文字。"},{"ja":"次のP、Pre-trainedは「事前に学習された」という意味です。モデルは、利用される前に、大量のテキストを使って言語のパターンを学習します。例えば、どのような言葉が、どのような文脈で続きやすいかを学びます。","zh":"第二个字母 P，Pre-trained，意思是“预训练”。模型在使用之前，会利用大量文本学习语言规律，例如在某种上下文中，哪些内容更容易接在后面。"},{"ja":"最後のTはTransformerです。これは、GPTの基礎となるモデルの構造を表しています。","zh":"最后的 T 是 Transformer，表示 GPT 所依据的模型结构。"}]},{"number":5,"title":"逐步预测生成文本","action":"点击「次の予測を表示」两次，逐步展示句子如何变长。","pairs":[{"ja":"GPTの基本的な動作は、次に続くトークンを予測することです。トークンとは、文章をモデルが扱うために分けた単位です。詳しくは後で説明します。","zh":"GPT 的基本工作方式是预测接下来出现的 token。token 是把文本拆分后供模型处理的单位，后面会详细介绍。"},{"ja":"ここでは、「I like」という文脈から始めます。画面には、その次の候補として「cats」が示されています。［１回クリック］選ばれた「cats」が元の文脈に加わり、「I like cats」になります。","zh":"这里从“I like”这个上下文开始。画面显示下一个候选是“cats”。［点击一次］选中的“cats”被加到原来的上下文中，变成“I like cats”。"},{"ja":"次に、更新された文脈から、さらに次を予測します。［もう１回クリック］ここではピリオドが加わり、文章が完成しました。","zh":"接下来，根据更新后的上下文继续预测。［再点击一次］这里加入了句号，示例句子就完成了。"},{"ja":"このように、GPTは「次を予測する、結果を文脈に加える、もう一度予測する」という操作を繰り返して文章を伸ばします。","zh":"因此，GPT 通过反复执行“预测下一个、加入上下文、再次预测”，逐步延长文本。"}]},{"number":6,"title":"因果遮罩","action":"依次点击「1: I」和「2: like」，指向表格中可见和被遮住的位置。","pairs":[{"ja":"次に、GPTの重要な特徴として、因果マスクを見てみます。","zh":"接下来介绍 GPT 的一个重要特点：因果遮罩。"},{"ja":"この表では、行が現在の位置、列が参照する位置を表します。［「1: I」をクリック］最初の位置では、「I」だけを参照でき、その後ろの「like」と「cats」は隠されています。","zh":"表格中的行表示当前位置，列表示被查看的位置。［点击“1: I”］在第一个位置，只能查看“I”，后面的“like”和“cats”都被遮住。"},{"ja":"［「2: like」をクリック］次の位置では、「I」と「like」を参照できますが、未来の「cats」は見ることができません。","zh":"［点击“2: like”］在第二个位置，可以查看“I”和“like”，但不能看到未来的“cats”。"},{"ja":"なぜこの制限が必要なのでしょうか。文章を左から順番に生成するとき、未来の言葉はまだ存在しません。そのため、学習中も未来を見ないようにして、生成するときと同じ条件で予測を学ばせます。","zh":"为什么需要这个限制？因为从左到右生成文本时，未来的内容还不存在。所以，训练时也要遮住未来内容，让模型在与生成时相同的信息条件下学习预测。"}]},{"number":7,"title":"从文字到模型输入","action":"从上到下指向文字、token、ID、嵌入和 GPT。","pairs":[{"ja":"ここから3.2節に入ります。GPTが次のトークンを予測することは分かりましたが、そもそも、私たちが入力した文章は、どのようにモデルへ渡されるのでしょうか。","zh":"从这里开始进入 3.2 节。我们已经知道 GPT 会预测下一个 token，但我们输入的文字究竟怎样被送进模型呢？"},{"ja":"この図は、その全体の流れを示しています。最初に「I like cats」という文章があります。まず、トークナイザで文章をトークンという小さな単位に分割します。次に、それぞれのトークンを語彙表に照らして、トークンIDに変換します。","zh":"这张图展示了整体流程。首先是“I like cats”这段文字。先用分词器把它拆成较小的单位，也就是 token；然后根据词汇表，把每个 token 转换成编号，即 token ID。"},{"ja":"その後、IDから埋め込みベクトルを取り出し、位置の情報と組み合わせます。こうして作られた数値の表現が、GPTへの入力になります。","zh":"接着，从 ID 取出嵌入向量，并与位置信息结合。这样形成的数值表示才会被送入 GPT。"},{"ja":"それでは、この流れを一つずつ詳しく見ていきます。","zh":"下面我们逐一详细来看。"}]},{"number":8,"title":"什么是 token","action":"依次点击「文字単位」「単語単位」「サブワード」。","pairs":[{"ja":"まず、トークンについて説明します。トークンは、文章をモデルが扱うために分けた部品です。ただし、トークンが必ず１文字や１単語になるわけではありません。","zh":"首先说明 token。token 是文本为了让模型处理而被拆分出的部件，但一个 token 不一定正好等于一个字符或一个单词。"},{"ja":"例えば、「unhappy」という文字列を見てみます。［文字単位をクリック］文字単位なら、一文字ずつに分かれます。［単語単位をクリック］単語単位なら、「unhappy」全体が一つの単位になります。","zh":"例如，看看“unhappy”这个字符串。［点击字符］如果按字符切分，就会逐字母拆开。［点击单词］如果按单词切分，整个“unhappy”就是一个单位。"},{"ja":"［サブワードをクリック］サブワード単位では、この例のように「un」と「happy」のような、単語より小さい部品に分けることもできます。","zh":"［点击子词］如果按子词切分，也可以像这个例子一样拆成“un”和“happy”这样比单词更小的部件。"},{"ja":"サブワードを使うと、よく使う部品を組み合わせて、さまざまな単語を表現できます。ここに示した分割は模式例です。実際にどこで区切られるかは、使用するトークナイザによって変わります。","zh":"使用子词可以通过组合常见部件来表示各种单词。不过这里展示的是示意例子，实际在哪里切分取决于使用的分词器。"}]},{"number":9,"title":"词汇表和 token ID","action":"点击「次のIDを調べる」三次，依次展示 0、1、2。","pairs":[{"ja":"トークンに分割した後は、それぞれを番号に変換します。ここで使うのが、ボキャブラリー、つまり語彙表です。語彙表は、トークンとIDの対応を記録した辞書のようなものです。","zh":"拆分成 token 之后，要把每个 token 转换成编号。这里使用的是 vocabulary，也就是词汇表。词汇表就像一本记录 token 与 ID 对应关系的字典。"},{"ja":"左側の表を見ると、この例では「I」が０、「like」が１、「cats」が２に対応しています。［３回に分けてクリック］入力されたトークンを左から順番に調べると、０、１、２というIDの列になります。","zh":"看左侧表格，在这个示例中，“I”对应 0，“like”对应 1，“cats”对应 2。［分三次点击］从左到右查找输入的 token，就得到 0、1、2 这样的 ID 序列。"},{"ja":"ここで注意したいのは、IDはあくまで識別するための番号だということです。例えば、IDが２だから、IDが１の言葉より意味が大きい、ということではありません。","zh":"要注意，ID 只是用于识别的编号。例如，ID 是 2，并不代表它的含义比 ID 是 1 的词更大。"},{"ja":"実際のモデルでは、語彙表はずっと大きくなります。","zh":"实际模型的词汇表要大得多。"}]},{"number":10,"title":"填充与截断","action":"先选择「最大長 2」，再选择「最大長 5」，比较截断与 PAD。","pairs":[{"ja":"文章をモデルに入力するとき、複数の系列の長さを調整することがあります。この画面には、長さの異なる２つの系列があります。","zh":"将文本输入模型时，有时需要调整多个序列的长度。画面中有两个长度不同的序列。"},{"ja":"［最大長２をクリック］最大長を２にすると、長い系列の後ろにある「cats」と「today」が切り詰められます。これをトランケーション、つまり截断と呼びます。切り詰めた部分は入力に含まれません。","zh":"［点击最大长度 2］当最大长度设为 2，较长序列后面的“cats”和“today”会被截掉。这叫 truncation，也就是截断；被截掉的部分不会进入模型。"},{"ja":"［最大長５をクリック］今度は短い系列に「PAD」という記号が加わります。これをパディングといい、まとめて処理する系列の長さをそろえるために使います。","zh":"［点击最大长度 5］这时会给较短的序列加入“PAD”标记。这叫 padding，即填充，用于统一批量处理时各序列的长度。"},{"ja":"また、PADを通常の内容として扱わないために、一般には別のマスクを使います。","zh":"另外，为了避免把 PAD 当作正常内容，通常还要使用单独的遮罩。"}]},{"number":11,"title":"BPE 的频率统计与合并","action":"先点击「初期状態に戻す」，再点击「最多ペアを結合」四次，每次停下来讲解画面变化。","pairs":[{"ja":"続いて、教材で詳しく紹介されているBPE、Byte Pair Encodingを見ていきます。BPEの基本的な考え方は、よく隣り合って現れる部品を、繰り返し結合することです。","zh":"接下来介绍教材重点讲解的 BPE，即 Byte Pair Encoding。BPE 的基本思路，是反复合并经常相邻出现的部件。"},{"ja":"ここでは、説明用の小さなコーパスを使います。「low」が２回、「lower」が１回現れるとします。最初は、それぞれを文字単位に分けています。画面の右側の数字は、その単語の出現回数です。","zh":"这里使用一个很小的示例语料：假设“low”出现两次，“lower”出现一次。最开始，分别按字符拆开。画面中的次数表示该词在语料中出现的次数。"},{"ja":"次に、隣り合う文字のペアを数えます。例えば「l」と「o」は、lowの中に２回、lowerの中に１回あるので、合計３回です。「o」と「w」も同じく３回です。今回は同率の場合、画面のルールに従って文字列の順で選び、「l」と「o」を先に結合します。","zh":"然后统计相邻字符对。例如，“l”和“o”在两个“low”中出现两次，在一个“lower”中出现一次，共三次。“o”和“w”也是三次。本示例在频率相同时按字符串顺序选择，因此先合并“l”和“o”。"},{"ja":"［１回目をクリック］すると、すべての「l」と「o」が「lo」という一つの部品になります。もう一度頻度を数えると、「lo」と「w」の組が３回で最も多くなります。","zh":"［点击第一次］所有相邻的“l”和“o”都合并成一个“lo”。重新统计后，“lo”和“w”的组合出现三次，是频率最高的一对。"},{"ja":"［２回目をクリック］これを結合すると、「low」が一つの部品になります。残ったペアの中では、「e」と「r」と、「low」と「e」がそれぞれ１回です。［３回目をクリック］この例では同率のため、先に「e」と「r」を結合します。［４回目をクリック］最後に「low」と「er」が結合され、「lower」になります。","zh":"［点击第二次］合并后，“low”变成一个部件。剩下的“e + r”和“low + e”都出现一次。［点击第三次］因为并列，本例先合并“e”和“r”。［点击第四次］最后合并“low”和“er”，得到“lower”。"},{"ja":"今回は結合の流れを確認するため、最後までボタンを押しました。しかし、実際に語彙表を作るときは、通常、語彙表の大きさや結合回数をあらかじめ設定し、その条件に達したところで止めます。BPEの目的は、よく使われる部品を大きな単位にまとめると同時に、小さな部品も残して、他の単語を組み合わせて表現できるようにすることです。","zh":"刚才为了看清楚合并过程，我们一直点到了最后。但实际构建词表时，通常会先设定词表大小或合并次数，到条件就停。BPE 的目的就是把常见片段合并成较大的单位，同时保留小片段来组合其他词。"}]},{"number":12,"title":"应用已学到的 BPE 规则","action":"保持上一页的四次合并结果，先点击「lower」，再点击「row」。","pairs":[{"ja":"前のページでは、コーパスから結合ルールを作りました。ここでは、そのルールを新しい入力に使ってみます。","zh":"上一页我们从语料中建立了合并规则。这一页来看看如何把这些规则用于新的输入。"},{"ja":"［「lower」をクリック］最初は文字ごとに分かれています。前のページで学んだ４つのルールを順番に適用すると、この例では最後に「lower」という一つのトークンになります。","zh":"［点击“lower”］最初它按字符拆开。按顺序应用上一页学到的四条规则后，在这个例子里，最终会得到一个“lower” token。"},{"ja":"［「row」をクリック］一方、「row」には学んだルールが当てはまらないため、文字が分かれたままです。","zh":"［点击“row”］而“row”没有符合已学规则的组合，因此仍然保持为分开的字符。"},{"ja":"このように、ルールを作る段階と、それを入力に適用する段階は分かれています。前のページでの結合回数によって、使えるルールも変わります。","zh":"可以看到，建立规则和把规则应用于输入是两个阶段。上一页的合并次数不同，这里能使用的规则也会改变。"}]},{"number":13,"title":"嵌入：从 ID 查找向量","action":"依次点击「like」和「cats」，观察表中高亮行与右侧向量。","pairs":[{"ja":"ここまで、文章をどのようにトークンに分け、トークンをどのようにトークンIDに対応させるかを学びました。次に、そのトークンIDがどのようにベクトルに変換されるかを見ます。IDはトークンを識別するための番号ですが、そのままではモデルが文脈を計算するための表現としては十分ではありません。","zh":"截止现在已经学习了文本怎么变成 token，token 怎么对应 token ID。接下来看看 token ID 如何转换成向量。ID 只是用来识别 token 的编号，本身还不是模型进行上下文计算时所使用的向量表示。"},{"ja":"そこで、埋め込み表を使い、各IDに対応するベクトル、つまり数値の組を取り出します。［「like」をクリック］この例では、「like」のIDは１で、対応するベクトルは「０、１」です。［「cats」をクリック］「cats」のIDは２で、ベクトルは「１、１」です。","zh":"因此，我们使用嵌入表，取出每个 ID 对应的向量，也就是一组数字。［点击“like”］在这个例子中，“like”的 ID 是 1，对应向量是“0、1”。［点击“cats”］“cats”的 ID 是 2，对应向量是“1、1”。"},{"ja":"ボタンを変えると、表の参照する行と、右側に表示される数値が変わります。このように、IDからベクトルを取り出す処理を、埋め込みと呼びます。","zh":"切换按钮时，表中被查找的行和右侧显示的数值也会改变。像这样根据 ID 取出向量的处理，称为嵌入。"},{"ja":"この画面の数値は説明用に作った２次元の例です。実際のモデルでは一般にもっと多くの次元があり、ベクトルの値は学習によって調整されます。","zh":"画面中的数字是为了讲解而构造的二维示例。实际模型通常使用更多维度，向量的值也会通过训练调整。"}]},{"number":14,"title":"加入位置嵌入","action":"点击「位置 0」和「位置 1」，对比两个加法结果。","pairs":[{"ja":"トークンのベクトルを用意したら、次に必要なのが位置の情報です。文章では、どの言葉があるかだけでなく、どの順番で並んでいるかも重要です。","zh":"准备好 token 向量之后，还需要位置信息。句子中不仅有哪些词很重要，它们按什么顺序排列也很重要。"},{"ja":"この画面では、同じ「like」というトークンを、異なる位置に置いて比べます。［位置０をクリック］トークンのベクトルは「０、１」、位置０のベクトルは「０、０」です。二つを足すと、「０、１」になります。","zh":"画面中把同一个“like”放在不同位置进行比较。［点击位置 0］token 向量是“0、1”，位置 0 的向量是“0、0”，两者相加得到“0、1”。"},{"ja":"［位置１をクリック］位置１では、位置ベクトルが「０.５、０」になります。同じトークンのベクトルに足すと、結果は「０.５、１」に変わります。","zh":"［点击位置 1］位置 1 的向量变成“0.5、0”。与相同的 token 向量相加后，结果变成“0.5、1”。"},{"ja":"つまり、同じトークンでも、位置に応じてモデルに渡される表現が変わります。ここで使う数値は、次の注意計算の例にもつながっています。","zh":"也就是说，即使 token 相同，位置不同，送入模型的表示也会改变。这里的数字还会用于下一页的注意力计算。"}]},{"number":15,"title":"实际计算注意力","action":"选择「I + like」，结合画面中的数值讲解。此页是说明用的微型模型。","pairs":[{"ja":"ここでは、入力されたトークンが、注意の計算を通して、文脈を含むベクトルになるまでを見ます。これは説明のための簡略モデルで、数値は架空のものです。","zh":"这里通过一个简化例子，看看输入的 token 怎样经过注意力计算，得到包含上下文信息的向量。例子里的数值是人为设定的。"},{"ja":"x₀ と x₁ は、それぞれトークン埋め込みに位置埋め込みを加えた後のベクトルです。I は、トークンの「1、0」に位置の「0、0」を加えた結果、「1、0」です。like は、「0、1」に位置の「0.5、0」を加えた結果、「0.5、1」です。","zh":"x₀ 和 x₁ 分别是加入位置向量后得到的向量。I 的 token 向量“1、0”加上位置向量“0、0”，结果是“1、0”。like 的 token 向量“0、1”加上位置向量“0.5、0”，得到“0.5、1”。"},{"ja":"次に、各位置から Q、K、V を作ります。この例では、計算を簡単にするため、Q、K、V を作る行列を単位行列にしているので、それぞれ入力ベクトルと同じ値になります。実際のモデルでは通常、学習される行列を使って変換します。","zh":"接着，从每个位置生成 Q、K、V。这个例子为了方便计算，把生成 Q、K、V 的权重矩阵设为单位矩阵，因此它们的数值与输入向量相同。实际模型通常使用可学习的矩阵进行变换。"},{"ja":"左側の表は注意スコアです。行は計算する位置、列は参照する位置を表します。例えば左上は、I の Q と I の K の内積を、次元数２の平方根で割った値です。I の Q と K はどちらも「1、0」なので、内積は１、スコアは約0.707です。","zh":"左侧表格显示注意力分数：行表示正在计算的位置，列表示参考的位置。例如左上角，用 I 的 Q 与 I 的 K 做点积，再除以根号 2。I 的 Q 和 K 都是“1、0”，点积为 1，因此分数约为 0.707。"},{"ja":"I から見て like は未来の位置なので、右上は因果マスクで隠されています。次に like の行では、like の Q と I の K、like の Q と like 自身の K をそれぞれ計算します。スコアは約0.354と0.884です。","zh":"对 I 而言，like 是未来位置，所以右上角被因果掩码遮住。再看 like 所在的行：分别计算 like 的 Q 与 I 的 K、like 的 Q 与自身的 K，得到的分数约为 0.354 和 0.884。"},{"zh":"这两个分数经过 Softmax 后，右侧显示的注意力权重分别约为 I 的 37% 和 like 自身的 63%。加权和就是把每个 V 向量乘以对应的权重，再将结果相加。这部分内容在第二章已经讲过了。得到的是融合了 I 的信息、对应 like 位置的新向量。下一页的简化演示会使用这个向量，预测下一个 token 的候选。","ja":"この２つのスコアをSoftmaxに通すと、右側のグラフのように、注意の重みはIが約37％、like自身が約63％になります。加重和は、それぞれのVベクトルに対応する重みをかけて、足し合わせたものです。この考え方は第２章でも説明しました。こうして、Iの情報も含んだ、likeの位置の新しいベクトルが得られます。次のページでは、このベクトルを使って、次のトークンの候補を予測します。"}]},{"number":16,"title":"从分数得到下一个 token","action":"先选择「I + like」，讲解 cats 的概率；再选择「I + cats」，比较变化。","pairs":[{"ja":"前のページで、文脈の情報をまとめたベクトルが得られました。このページでは、そのベクトルから次のトークンの候補を選ぶまでを見ます。","zh":"上一页得到了汇总上下文信息的向量。这一页展示如何从该向量得到下一个 token 的候选结果。"},{"ja":"［「I + like」を選択］上には、前のページと同じ注意の加重和が表示されています。このミニモデルでは、そのベクトルと各候補の出力ベクトルとの内積を計算し、候補ごとのスコアを出します。例えば「cats」のスコアは約１.３１５です。","zh":"［选择“I + like”］上方显示的是与上一页相同的注意力加权和。在这个微型模型中，将该向量与每个候选的输出向量做点积，得到各候选的分数。例如“cats”的分数约为 1.315。"},{"zh":"接着用 softmax 把各个分数转换成概率。根据柱状图，“cats”的概率约为 43.7%，是此例中最高的。本页演示的是选择概率最高的候选。","ja":"次に、それぞれのスコアをsoftmaxで確率に変換します。「cats」が約43.7％で、この例では最も高くなっています。今回は、確率が最も高い候補を選んでいます。"},{"ja":"［「I + cats」をクリック］入力を変えると、前のページの注意計算からやり直すため、各候補の確率も変わります。実際の文章生成では、常に最大値を選ぶとは限らず、確率に基づくサンプリングなどの方法も使われます。","zh":"［点击“I + cats”］改变输入后，程序会重新进行上一页的注意力计算，因此各候选概率也会改变。实际生成文本时，并不一定总是选择最大概率，也可以使用基于概率的采样等方法。"}]},{"number":17,"title":"其他分词方法","action":"依次指向 BPE、WordPiece、SentencePiece。","pairs":[{"ja":"ここまでBPEを中心に見てきましたが、トークンに分割する方法はほかにもあります。教材では、WordPieceとSentencePieceも紹介されています。","zh":"前面我们主要介绍了 BPE，但切分 token 的方法还有其他选择。教材还介绍了 WordPiece 和 SentencePiece。"},{"ja":"WordPieceもサブワードを扱いますが、語彙を作るときの選択基準はBPEと異なります。SentencePieceはテキストからサブワードを扱う仕組みで、日本語のように単語の間に空白がない言語にも利用できます。","zh":"WordPiece 也处理子词，但构建词汇表时的选择标准与 BPE 不同。SentencePiece 是从文本处理子词的一种工具，也可用于单词之间没有空格的日语等语言。"},{"ja":"いずれも、文章をモデルが扱いやすいトークンの列にするためのものです。","zh":"它们都是为了将文本转换成模型容易处理的 token 序列。"}]},{"number":18,"title":"总结与结束","action":"结合流程图总结 GPT 与输入处理，然后结束发表。","pairs":[{"zh":"最后，简单总结一下今天的内容。GPT 以 Transformer 为基础，根据已有上下文预测下一个 token，并通过反复预测生成文本。","ja":"最後に、今日の内容を簡単にまとめます。GPTはTransformerを基礎にしたモデルで、それまでの文脈から次のトークンを予測し、その予測を繰り返すことで文章を生成します。"},{"zh":"在输入模型之前，文本先被分词器拆成 token，再通过词汇表转换成 ID。","ja":"文章をモデルに入力する前に、トークナイザでトークンに分け、語彙表を使ってIDに変換します。"},{"zh":"接着，模型从 ID 取出嵌入向量，加入位置信息，再通过注意力机制组合上下文信息，用来预测下一个 token。","ja":"次に、IDから埋め込みベクトルを取り出して位置の情報を加えます。そして、注意の仕組みで文脈の情報を組み合わせ、次のトークンを予測します。"},{"zh":"我的发表到此结束。感谢大家聆听。","ja":"以上で発表を終わります。ご清聴ありがとうございました。"}]}]}</script><script>
(()=>{'use strict';const initial=JSON.parse(document.getElementById('initial-data').textContent);const legacyKey='zemi-chapter3-speech:'+location.pathname;const oldKey=legacyKey+':v2';let key=legacyKey+':v3';let state=JSON.parse(JSON.stringify(initial)),editing=false,storage=true;const status=document.getElementById('status');
function adjustIntro(st){const p=st.pages[1];if(!p||!p.pairs[1])return;const q=p.pairs[1];if(q.zh==='3.1 节介绍 GPT 是什么，以及它的发展和应用。')q.zh='3.1 节介绍 GPT 是什么，以及它的基本工作方式。';if(q.ja==='3.1節では、GPTとは何か、そしてその発展や応用について説明します。')q.ja='3.1節では、GPTとは何か、そしてその基本的な仕組みについて説明します。';}
try{const saved=localStorage.getItem(key);if(saved){const parsed=JSON.parse(saved);if(parsed&&Array.isArray(parsed.pages)&&parsed.pages.length===18)state=parsed;}else{const old=localStorage.getItem(oldKey);if(old){const parsed=JSON.parse(old);if(parsed&&Array.isArray(parsed.pages)&&parsed.pages.length===19){state=parsed;state.pages.splice(6,1);state.pages.forEach((p,i)=>p.number=i+1);adjustIntro(state);localStorage.setItem(key,JSON.stringify(state));}}else{const legacy=localStorage.getItem(legacyKey);if(legacy){const previous=JSON.parse(legacy);if(previous&&Array.isArray(previous.pages)&&previous.pages.length===20){for(let i=0;i<state.pages.length-1;i++){const oldIndex=i<6?i:i+1;if(i===1)continue;const oldPage=previous.pages[oldIndex],newPage=state.pages[i];if(!oldPage||!Array.isArray(oldPage.pairs)||oldPage.pairs.length!==newPage.pairs.length)continue;for(let j=0;j<newPage.pairs.length;j++){if(i===0&&j===1)continue;newPage.pairs[j]=oldPage.pairs[j];}}adjustIntro(state);localStorage.setItem(key,JSON.stringify(state));}}}}}catch(e){storage=false}
try{const revisedKey=legacyKey+':v4';const revised=localStorage.getItem(revisedKey);if(revised){const parsed=JSON.parse(revised);if(parsed&&Array.isArray(parsed.pages)&&parsed.pages.length===18)state=parsed;}else{for(const n of [10,12,17]){const index=state.pages.findIndex(p=>p.number===n);const replacement=initial.pages.find(p=>p.number===n);if(index>=0&&replacement)state.pages[index].pairs=JSON.parse(JSON.stringify(replacement.pairs));}localStorage.setItem(revisedKey,JSON.stringify(state));}key=revisedKey;}catch(e){storage=false}
try{const finalKey=legacyKey+':v5';const savedFinal=localStorage.getItem(finalKey);if(savedFinal){const parsed=JSON.parse(savedFinal);if(parsed&&Array.isArray(parsed.pages)&&parsed.pages.length===18)state=parsed;}else{const updates=[[5,3,"ja","次に、更新された文脈から、さらに次を予測します。クリックして、ピリオドが加わり、文章が完成しました。","次に、更新された文脈から、さらに次を予測します。［もう１回クリック］ここではピリオドが加わり、文章が完成しました。"],[6,2,"ja","この表では、行が現在の位置、列が参照する位置を表します。［「1: I」をクリック］最初の位置では、「I」だけを参照でき、その後ろの「like」と「cats」は隠される。","この表では、行が現在の位置、列が参照する位置を表します。［「1: I」をクリック］最初の位置では、「I」だけを参照でき、その後ろの「like」と「cats」は隠されています。"],[6,3,"ja","［「2: like」をクリック］次の位置では、「I」と「like」を参照できますが、未来の「cats」は見ることができない。","［「2: like」をクリック］次の位置では、「I」と「like」を参照できますが、未来の「cats」は見ることができません。"],[6,4,"ja","なぜこの制限必要か。文章を左から順番に生成するとき、未来の言葉はまだ存在しない。そのため、学習中も未来を見ないようにして、生成するときと同じ条件で予測を学ばせます。","なぜこの制限が必要なのでしょうか。文章を左から順番に生成するとき、未来の言葉はまだ存在しません。そのため、学習中も未来を見ないようにして、生成するときと同じ条件で予測を学ばせます。"],[7,2,"ja","この図は、その全体の流れを示しています。最初に「I like cats」という文章があります。まず、トークナイザで文章をトークンという小さな単位に分割します。次に、それぞれのトークンを語彙表に照らして，トークンIDに変換します。","この図は、その全体の流れを示しています。最初に「I like cats」という文章があります。まず、トークナイザで文章をトークンという小さな単位に分割します。次に、それぞれのトークンを語彙表に照らして、トークンIDに変換します。"],[8,1,"ja","まず、トークンについて説明します。トークンは、文章をモデルが扱うために分けた部品です。ただし、トークンが必ず１文字や１単語になるわけではない。","まず、トークンについて説明します。トークンは、文章をモデルが扱うために分けた部品です。ただし、トークンが必ず１文字や１単語になるわけではありません。"],[8,2,"ja","例えば、「unhappy」という文字列を見ます、文字単位なら、一文字ずつに分かれます。単語単位なら、「unhappy」全体が一つの単位になります。","例えば、「unhappy」という文字列を見てみます。［文字単位をクリック］文字単位なら、一文字ずつに分かれます。［単語単位をクリック］単語単位なら、「unhappy」全体が一つの単位になります。"],[15,2,"zh"," x₀ 和 x₁，分别是加入位置向量后得到的向量。I 的 token 向量“1、0”加上位置向量“0、0”，结果是“1、0”。like 的 token 向量“0、1”加上位置向量“0.5、0”，得到“0.5、1”。","x₀ 和 x₁ 分别是加入位置向量后得到的向量。I 的 token 向量“1、0”加上位置向量“0、0”，结果是“1、0”。like 的 token 向量“0、1”加上位置向量“0.5、0”，得到“0.5、1”。"],[17,1,"ja","ここまでBPEを中心に見てきましたが、トークンに分割する方法はほかにもあります。教材は、WordPieceとSentencePieceも紹介します。","ここまでBPEを中心に見てきましたが、トークンに分割する方法はほかにもあります。教材では、WordPieceとSentencePieceも紹介されています。"]];for(const [n,p,lang,old,value] of updates){const pair=state.pages[n-1]?.pairs[p-1];if(pair&&pair[lang]===old)pair[lang]=value;}f
